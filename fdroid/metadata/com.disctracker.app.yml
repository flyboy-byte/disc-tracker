AutoName: Disc Tracker
Summary: Local-first disc golf bag tracker
Description: >-
  A disc golf bag tracker that belongs to you — your discs, your data, on
  your own device. No accounts, no cloud, no tracking, no ads.


  Manage your bag with a searchable 1,660+ disc library (or an optional
  larger downloaded catalog), see flight-path arcs shaped by each disc's
  speed/glide/turn/fade, and shape a throw interactively with Flight Shaper —
  including an opt-in on-device physics simulation. Disc Suggest ranks the
  best discs for a shot from your own bag or the full library, with a
  swipe-to-reorder gesture and an optional learning engine for browsing
  what to buy next. Score keeps a fully offline hole-by-hole scorecard for
  when the usual app won't load. Back up everything to one file and move it
  to a new phone yourself — no server involved.


  The only network request this app can ever make is opt-in: real measured
  flight-path reference images from a public third-party API, off by
  default, used only when you turn it on.


# Drafted 2026-08-20, NOT YET APPLIED to the VPS. Modeled directly on the live
# /etc/nginx/sites-available/golf.flyboybyte.com config (pulled via SSH, same box,
# same static-root pattern — see ~/security/services.md's "mini-golf" section) and
# ~/security/system-layout.md's confirmed facts: nginx runs as www-data, /home/ubuntu
# is mode 750 so www-data can't read into it (why this can't live under ~/disc_tracker/
# like the app itself does), and every named vhost includes the shared security-headers
# snippet + gets its own Let's Encrypt cert via Certbot.
#
# Deliberate deviation from golf.flyboybyte.com's precedent: that root is owned
# root:root (755, world-readable — nginx only needs read+traverse, ownership doesn't
# matter to it). This repo gets updated far more often (every app release, not a rare
# rebuild), so /var/www/fdroid.flyboybyte.com should be owned ubuntu:ubuntu instead —
# lets `fdroid deploy`'s plain rsync-over-ssh (as the ubuntu user) write there directly,
# no sudo choreography needed on every deploy. Still 755, still world-readable, nginx's
# read access is identical either way.
#
# To actually stand this up (in order):
#   1. sudo mkdir -p /var/www/fdroid.flyboybyte.com && sudo chown ubuntu:ubuntu /var/www/fdroid.flyboybyte.com
#   2. DNS: add an A record for fdroid.flyboybyte.com -> 51.81.80.126 (Logan's registrar, not SSH-reachable)
#   3. Wait for DNS to actually resolve, then: sudo certbot --nginx -d fdroid.flyboybyte.com
#      (this both gets the cert AND rewrites this file's ssl_certificate lines to match,
#      same as it did for every other vhost on this box — the lines below are placeholders)
#   4. Copy this file to /etc/nginx/sites-available/fdroid.flyboybyte.com,
#      symlink into sites-enabled, nginx -t, systemctl reload nginx
#   5. Uncomment serverwebroot in config.yml (already drafted there, points at
#      .../var/www/fdroid.flyboybyte.com/fdroid — fdroidserver appends "repo" itself,
#      creating the nested dir on first deploy, no manual mkdir needed for it).
#      repo_url is already set to the real value (https://fdroid.flyboybyte.com/fdroid/repo).
#   6. fdroid deploy (rsync's repo/ up, reuses the same SSH access deploy.sh already has)

server {
    server_name fdroid.flyboybyte.com;

    root /var/www/fdroid.flyboybyte.com;
    index index.html;

    # Pure static — no proxy_pass, no app process. Everything fdroidserver generates
    # (index-v1.json, index-v2.json, entry.jar, the APKs, icons, index.html) is a
    # plain file; fdroidserver's own index.html already gives a browsable landing page.
    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/security-headers.conf;

    # New public, fully unauthenticated, bulk-download surface — matches the
    # "first unauthenticated surface gets a limit_req zone" lesson already applied to
    # disc.flyboybyte.com's /catalog/ routes (docs/vps-catalog-hosting-proposal.md).
    # Rate (not burst) limited, since repeated APK downloads are a legitimate use case
    # (an F-Droid client re-checking the index), unlike a login endpoint.
    limit_req zone=fdroid_repo burst=30 nodelay;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fdroid.flyboybyte.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fdroid.flyboybyte.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = fdroid.flyboybyte.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name fdroid.flyboybyte.com;
    listen 80;
    return 404; # managed by Certbot
}


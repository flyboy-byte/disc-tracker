# Deployed 2026-08-20 as an HTTP-only bootstrap vhost (staged on the VPS at
# /etc/nginx/sites-available/fdroid.flyboybyte.com, symlinked into sites-enabled,
# nginx -t passed, reloaded). Verified working via `curl -H "Host: fdroid.flyboybyte.com"
# http://51.81.80.126/fdroid/repo/index-v2.json` — real, signed repo JSON, and the APK
# itself downloads (200, correct Content-Length) — not the 000-default 444 catch-all.
#
# One bug found and fixed live: `root` was originally set to
# .../fdroid.flyboybyte.com/fdroid (matching serverwebroot's on-disk path), but the
# URL itself already starts with /fdroid/ (repo_url ends in .../fdroid/repo) — that
# doubled the segment and 404'd everything. `root` must be the parent
# (/var/www/fdroid.flyboybyte.com, no trailing /fdroid) so nginx appends the URL's own
# /fdroid/repo/... onto it and lands on the real on-disk path. Fixed and reverified.
#
# NOT YET the final form. fdroid.flyboybyte.com has no DNS A record yet (Logan's
# registrar, Spaceship — no API/token available here) so Certbot can't issue a real
# cert via HTTP-01 challenge until that exists. Once the A record -> 51.81.80.126 is
# added and has propagated, run on the VPS:
#
#   sudo certbot --nginx -d fdroid.flyboybyte.com
#
# Certbot will rewrite this exact file in place — adding the SSL server block, the
# ssl_certificate/ssl_certificate_key lines, the 80->443 redirect, and the
# "# managed by Certbot" markers — the identical mechanism that produced every other
# vhost on this box (golf.flyboybyte.com, disc.flyboybyte.com, etc.). No manual
# SSL config needed at that point; this file is deliberately left minimal until then.

server {
    listen 80;
    server_name fdroid.flyboybyte.com;

    root /var/www/fdroid.flyboybyte.com;
    index index.html;

    # Pure static — no proxy_pass, no app process. Everything fdroidserver generates
    # (index-v1.json, index-v2.json, entry.jar, the APK, icons, index.html) is a
    # plain file; fdroidserver's own index.html already gives a browsable landing page.
    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/security-headers.conf;

    # New public, fully unauthenticated, bulk-download surface — matches the
    # "first unauthenticated surface gets a limit_req zone" lesson already applied to
    # disc.flyboybyte.com's /catalog/ routes (docs/vps-catalog-hosting-proposal.md).
    limit_req zone=fdroid_repo burst=30 nodelay;
}

# Added once, in /etc/nginx/nginx.conf's http{} block (alongside the existing
# disc_catalog zone):
#   limit_req_zone $binary_remote_addr zone=fdroid_repo:10m rate=30r/s;

# FINAL, LIVE FORM — pulled verbatim from /etc/nginx/sites-available/fdroid.flyboybyte.com
# on the VPS, 2026-08-21, after Logan added the DNS A record and
# `sudo certbot --nginx -d fdroid.flyboybyte.com` ran successfully. Certbot rewrote the
# original HTTP-only draft in place exactly as predicted — added the SSL server block,
# the ssl_certificate/ssl_certificate_key lines, and the 80->443 redirect block, all
# marked "# managed by Certbot", identical to how every other vhost on this box
# (golf.flyboybyte.com, disc.flyboybyte.com, etc.) got its cert.
#
# Verified fully working: `curl https://fdroid.flyboybyte.com/fdroid/repo/index-v2.json`
# (real signed index, valid Let's Encrypt cert, notAfter 2026-11-19, auto-renews),
# `curl -I http://fdroid.flyboybyte.com/...` (301 -> https), and the APK itself
# downloads (200, correct Content-Length). This is the real, deployed config — do not
# hand-edit without also applying the same change on the VPS, they will drift.

server {
    server_name fdroid.flyboybyte.com;

    root /var/www/fdroid.flyboybyte.com;
    index index.html;

    # Pure static — no proxy_pass, no app process. Everything fdroidserver generates
    # (index-v1.json, index-v2.json, entry.jar, the APK, icons, index.html) is a
    # plain file; fdroidserver's own index.html already gives a browsable landing page.
    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/security-headers.conf;

    # New public, fully unauthenticated, bulk-download surface — matches the
    # "first unauthenticated surface gets a limit_req zone" lesson already applied to
    # disc.flyboybyte.com's /catalog/ routes (docs/vps-catalog-hosting-proposal.md).
    limit_req zone=fdroid_repo burst=30 nodelay;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fdroid.flyboybyte.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fdroid.flyboybyte.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Added once, in /etc/nginx/nginx.conf's http{} block (alongside the existing
# disc_catalog zone):
#   limit_req_zone $binary_remote_addr zone=fdroid_repo:10m rate=30r/s;


server {
    if ($host = fdroid.flyboybyte.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name fdroid.flyboybyte.com;
    return 404; # managed by Certbot


}